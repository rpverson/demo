version: '3.9'
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ambiental-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ambiental
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7.4-alpine
    container_name: ambiental-redis
    restart: unless-stopped
    ports:
      - '6379:6379'

volumes:
  pg_data:
